<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b12" />
    <title>EcoGuardian</title>
    <script>
      // Applied synchronously (before first paint) to avoid a flash of the
      // wrong theme. Mirrors the logic in src/theme/ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem('centinela_theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-coreui-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-coreui-theme', 'dark')
        }
      })()
    </script>
    <meta name="description" content="Deteccion y monitorizacion de vertederos ilegales mediante IA, imagenes satelitales y drones." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <!-- No custom Google Fonts: typography uses CoreUI's own default
         font stack (--cui-font-sans-serif, see styles/global.css) to
         match the look of the stock CoreUI React admin template. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
