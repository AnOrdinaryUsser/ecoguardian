# Stack completo de produccion: postgis + backend + model-service +
# frontend (servido por Caddy, con HTTPS automatico). Pensado para
# levantarse igual en un servidor Ubuntu (Docker Engine) o en Windows
# (Docker Desktop) - ver DEPLOYMENT.md, Opcion A.
#
# Se mantiene SEPARADO del docker-compose.yml existente (que solo levanta
# postgis, para desarrollo local) en vez de sustituirlo, para no romper
# el flujo de desarrollo que ya usabas.
#
# Uso:
#   cp .env.docker.example .env   (y edita DOMAIN, POSTGRES_PASSWORD, etc.)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nota sobre pesos y datos: model-service/weights/best.pt y los datos
# cargados por etl/ NO viven en la imagen (estan en .gitignore a
# proposito) - se montan como volumenes desde el host, ver mas abajo y
# DEPLOYMENT.md.

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: ecoguardian_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoguardian}
      POSTGRES_USER: ${POSTGRES_USER:-ecoguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - ecoguardian_postgis_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoguardian}"]
      interval: 5s
      timeout: 5s
      retries: 30
      # La primera vez, Postgres no solo arranca: tambien ejecuta TODO
      # database/schema/*.sql (initdb + CREATE EXTENSION postgis + las 7
      # migraciones) antes de aceptar conexiones - en un disco lento eso
      # puede tardar bastante mas que "retries: 10" a 5s (50s), que es lo
      # que causaba "dependency failed to start: postgis is unhealthy"
      # aunque Postgres no estuviera roto, solo tardando. start_period da
      # un margen inicial que no cuenta como fallos; 30 reintentos dan
      # hasta ~2.5 minutos mas encima de eso antes de darlo por caido de
      # verdad. Arranques posteriores (ya con los datos en el volumen) son
      # mucho mas rapidos, esto solo importa en el primer "up".
      start_period: 60s
    # Sin "ports:" aqui a proposito: en produccion nada fuera de la red
    # interna de Docker necesita hablar directamente con Postgres. Si
    # necesitas conectarte con un cliente SQL desde el host para depurar,
    # anade temporalmente "ports: [\"5432:5432\"]" o usa
    # "docker compose -f docker-compose.prod.yml exec postgis psql ...".

  model-service:
    build:
      context: ./model-service
    container_name: ecoguardian_model_service
    restart: unless-stopped
    environment:
      MODEL_SERVICE_PORT: 8000
      MODEL_WEIGHTS_PATH: ${MODEL_WEIGHTS_PATH:-./weights/best.pt}
      DEFAULT_CONFIDENCE_THRESHOLD: ${DEFAULT_CONFIDENCE_THRESHOLD:-0.90}
      PNOA_WMS_URL: ${VITE_PNOA_WMS_URL:-https://www.ign.es/wms-inspire/pnoa-ma}
      # Imagen de satelite (Mapbox). Sin token el modelo no puede analizar.
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      MAPBOX_STYLE: ${MAPBOX_STYLE:-mapbox/satellite-v9}
      MAPBOX_IMAGE_SIZE: ${MAPBOX_IMAGE_SIZE:-640}
      MAPBOX_RETINA: ${MAPBOX_RETINA:-true}
      MAPBOX_CROP_BOTTOM: ${MAPBOX_CROP_BOTTOM:-0.07}
    volumes:
      # Monta tus pesos entrenados desde el host - la carpeta del repo
      # esta vacia salvo un .gitkeep, ver DEPLOYMENT.md.
      - ./model-service/weights:/app/weights:ro
    # Sin "ports:" - solo el backend le habla, por la red interna de
    # Docker ("http://model-service:8000"), nunca expuesto a internet.

  backend:
    build:
      context: ./backend
    container_name: ecoguardian_backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      BACKEND_PORT: 4000
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecoguardian}
      POSTGRES_USER: ${POSTGRES_USER:-ecoguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      MODEL_SERVICE_URL: http://model-service:8000
      # Cuántas peticiones de inferencia deja pasar el backend a la vez
      # hacia model-service, sea cual sea el número de usuarios que estén
      # analizando a la vez - ver backend/src/services/modelClient.js.
      # Por defecto 2, a juego con el único worker de uvicorn con el que
      # arranca model-service (ver model-service/Dockerfile). Solo tiene
      # sentido subirlo si tambien se sube el numero de workers/CPU de
      # model-service.
      MODEL_SERVICE_CONCURRENCY: ${MODEL_SERVICE_CONCURRENCY:-2}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      # Detras de Caddy: la IP real del cliente viene en X-Forwarded-For.
      TRUST_PROXY: 1
      # Sesiones y usuario administrador inicial.
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (deploy.sh lo genera solo)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      JWT_REMEMBER_EXPIRES_IN: ${JWT_REMEMBER_EXPIRES_IN:-30d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecoguardian.es}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Enlaces de los correos (bienvenida, recuperar contrasena, alertas).
      APP_URL: ${APP_URL:-https://ecoguardian.es}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-EcoGuardian <no-reply@ecoguardian.es>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Videos de vuelos y fotogramas: en un volumen para que sobrevivan a los redeploys.
      UPLOADS_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      KEEP_FLIGHT_VIDEO: ${KEEP_FLIGHT_VIDEO:-false}
      # Areas monitorizadas, tamanos, dataset y rutas.
      AREA_SCHEDULER: ${AREA_SCHEDULER:-on}
      AREA_SCHEDULER_INTERVAL_SECONDS: ${AREA_SCHEDULER_INTERVAL_SECONDS:-300}
      AREA_MAX_CELLS: ${AREA_MAX_CELLS:-400}
      AREA_CONCURRENCY: ${AREA_CONCURRENCY:-2}
      DETECTION_DEDUPE_METERS: ${DETECTION_DEDUPE_METERS:-40}
      DATASET_MAX_IMAGES: ${DATASET_MAX_IMAGES:-5000}
      LEGAL_FACILITY_RADIUS_METERS: ${LEGAL_FACILITY_RADIUS_METERS:-300}
    volumes:
      - ecoguardian_uploads:/app/uploads
    # Sin "ports:" - Caddy (servicio "frontend") es el unico punto de
    # entrada publico; llega aqui via la red interna ("http://backend:4000").

  # Ejecuta los scripts de etl/scripts/*.py contra "postgis" por la red
  # interna de Docker - nunca arranca solo ("up -d"), solo se lanza a
  # demanda con "docker compose ... run --rm etl python scripts/<script>.py"
  # (ver deploy.sh, paso 5, y DEPLOYMENT.md). El profile "etl" es justo para
  # eso: lo mantiene fuera de un "docker compose up" normal.
  etl:
    profiles: ["etl"]
    build:
      context: ./etl
    container_name: ecoguardian_etl
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecoguardian}
      POSTGRES_USER: ${POSTGRES_USER:-ecoguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      # Los ficheros fuente (.xlsx, .gpkg, .zip, .json...) se suben por
      # SFTP a etl/data/ en el host - ver DEPLOYMENT.md. Montados de solo
      # lectura: los scripts solo leen de aquí, nunca escriben.
      - ./etl/data:/app/data:ro

  frontend:
    build:
      # Contexto = raiz del repo (no ./frontend) - necesario para que el
      # Dockerfile pueda copiar el /Caddyfile de la raiz, ver el comentario
      # al principio de frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
        VITE_ACCESS_TOKEN: ${VITE_ACCESS_TOKEN:-}
        VITE_PNOA_WMS_URL: ${VITE_PNOA_WMS_URL:-https://www.ign.es/wms-inspire/pnoa-ma}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: ecoguardian_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?Debes definir DOMAIN en tu .env - ver .env.docker.example}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy guarda aqui el certificado Let's Encrypt y su estado, para
      # no tener que volver a pedirlo cada vez que se recrea el contenedor.
      - ecoguardian_caddy_data:/data
      - ecoguardian_caddy_config:/config

volumes:
  ecoguardian_uploads:
  ecoguardian_postgis_data:
  ecoguardian_caddy_data:
  ecoguardian_caddy_config:
